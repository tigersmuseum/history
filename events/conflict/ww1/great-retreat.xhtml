<article about="dbp:Great_Retreat">
	<h2 property="skos:prefLabel">The Retreat from Mons</h2>
		<p class="dates">
		<span rel="time:hasBeginning"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-08-23">23<sup>th</sup> August</datetime></span> - 
		<span rel="time:hasEnd"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-09-05">5<sup>th</sup> September</datetime> 1914</span>
		</p>
		<p>Also known as the <span property="skos:altLabel">The Great Retreat</span>.</p>
		<p typeof="skos:Concept" rel="skos:related">The <span rel="skos:broader" resource="dbp:Battle_honour">battle honour</span> is <span property="skos:prefLabel" class="battleHonour">Retreat from Mons</span>.</p>
</article>

		</p>

	</article>
