<body>

<article about="dbp:Race_to_the_Sea">
	<h2 property="skos:prefLabel">Race to the Sea</h2>
		<p class="dates">
		<span rel="time:hasBeginning"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-09-17">17<sup>th</sup> September</datetime></span> - 
		<span rel="time:hasEnd"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-10-19">19<sup>th</sup> October</datetime> 1914</span>
		</p>
</article>

<div about="dbp:Race_to_the_Sea" typeof="ies:Event" rev="ies:isPartOf">

	<article about="dbp:Battle_of_La_Bassée">
		<h3 property="skos:prefLabel">Battle of La Bassée</h3>
		<p class="dates">
		<span rel="time:hasBeginning"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-10-10">10<sup>th</sup> October</datetime></span> - 
		<span rel="time:hasEnd"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-11-02">2<sup>nd</sup> November</datetime> 1914</span>
		</p>
		<p typeof="skos:Concept" rel="skos:related">The <span rel="skos:broader" resource="dbp:Battle_honour">battle honour</span> is <span property="skos:prefLabel" class="battleHonour">La Bassee 1914</span>.</p>
	</article>

	<article about="#gheluvelt">
		<h3 property="skos:prefLabel">Battle of Armentières</h3>
		<p class="dates">
		<span rel="time:hasBeginning"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-10-13">13<sup>th</sup> October</datetime></span> - 
		<span rel="time:hasEnd"><datetime property="time:inXSDDate" typeof="time:Instant" content="1914-11-02">2<sup>nd</sup> November</datetime> 1914</span>
		</p>
		<p>Also known as the <span property="skos:altLabel">Battle of Lille</span>.</p>
		<p typeof="skos:Concept" rel="skos:related">The <span rel="skos:broader" resource="dbp:Battle_honour">battle honour</span> is <span property="skos:prefLabel" class="battleHonour">Armentieres 1914</span>.</p>
	</article>
