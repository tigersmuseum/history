<article>
<p about="dbp:Second_Boer_War" typeof="time:Interval">
	The <span property="skos:prefLabel">Second Boer War</span> started on <span rel="time:hasBeginning"><datetime typeof="time:Instant" property="time:inXSDDate" content="1899-10-11">11 October 1899</datetime></span> and ended on <span rel="time:hasEnd"><datetime typeof="time:Instant" property="time:inXSDDate" content="1902-05-31">31 May 1902</datetime></span>.
</p>
</article>

<article>
<p about="dbp:World_War_I" typeof="time:Interval">
	The <span property="skos:prefLabel">First World War</span> started on <span rel="time:hasBeginning"><datetime typeof="time:Instant" property="time:inXSDDate" content="1914-07-28">28 July 1914</datetime></span> and ended on <span rel="time:hasEnd"><datetime typeof="time:Instant" property="time:inXSDDate" content="1918-11-11">11 November 1918</datetime></span>.
</p>
</article>

<article>
<p about="dbp:World_War_II" typeof="time:Interval">
	The <span property="skos:prefLabel">Second World War</span> started on <span rel="time:hasBeginning"><datetime typeof="time:Instant" property="time:inXSDDate" content="1939-09-01">1 September 1939</datetime></span> and ended on <span rel="time:hasEnd"><datetime typeof="time:Instant" property="time:inXSDDate" content="1945-09-02">2 September 1945</datetime></span>.
</p>
